name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        shell: pwsh
        run: ./tests/run.ps1

      - name: Verify release binary
        id: verify
        shell: pwsh
        run: |
          $manifest = Get-Content update.json -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash dist/UsagePeek.exe -Algorithm SHA256).Hash
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''

          if ($manifest.version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match update.json version $($manifest.version)."
          }

          if ($actualHash -ne $manifest.sha256) {
            throw "dist/UsagePeek.exe does not match update.json SHA-256."
          }

          "$actualHash  UsagePeek.exe`n" | Set-Content `
            -Path dist/SHA256SUMS.txt -Encoding ascii -NoNewline

          $manifestText = (Get-Content update.json -Raw).Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'dist/update.json'),
            $manifestText, [System.Text.UTF8Encoding]::new($false))

          "sha256=$actualHash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          $manifest = Get-Content update.json -Raw | ConvertFrom-Json
          $notes = @"
          UsagePeek $($manifest.version) Windows 版本。

          ## 本版说明

          $($manifest.notes)

          ## 主要功能

          - 查看 Codex 5 小时 Session 与 7 天 Weekly 用量、重置倒计时和节奏预测。
          - 统计今天、昨天、近 30 天及本机累计 Token；用量写入持久账本并逐条去重，保留历史 API 等价估值。
          - 支持经典面板及鲸鱼娘、菲比啾比、ChatGPT 娘、Claude 娘、奶蛙五种桌宠外形，可自定义大小与已用/剩余显示，并支持 classic petpet 摸头互动。
          - 切回桌面后立即在当前显示器内散步，前台有应用窗口时停下并朝向鼠标；拖动、摸头、打开菜单或面板时暂停散步。
          - 右键桌宠或托盘可切换“桌宠自动移动”，选择会自动保存，重启后保留。
          - 桌宠气泡显示 5 小时与 7 天额度的恢复日期和本地时间，背景直接取当前形象的图片平均色，文字自动适配明暗。
          - 支持美元与人民币换算、开机自启、在线更新和 Codex CLI 一键修复。
          - 全新简约界面，支持浅色、深色、跟随系统主题，以及圆角下拉菜单和百分比加减控件。
          - 诊断概览直接显示连接、价格覆盖和显示状态，按需展开并复制完整脱敏报告。
          - 更新失败或新版本无法正常启动时会自动恢复旧版本。
          - “关于 UsagePeek”可复制当前 EXE 的 SHA-256，诊断技术详情可查看完整值。
          - “关于 UsagePeek”中展示版本信息与项目鸣谢。
          - 单文件运行，无需安装 UsagePeek 本体。

          ## 来源与许可

          UsagePeek 从 [OpenUsage](https://github.com/robinebers/openusage) 的界面、用量统计、节奏预测和 Provider 思路改造而来，是独立的 Windows/C# 社区实现，并非 OpenUsage 官方 Windows 客户端。鲸鱼娘形象鸣谢 **ZipZipPipe**。完整署名见 [THIRD_PARTY_NOTICES.md](https://github.com/Supaio/UsagePeek/blob/main/THIRD_PARTY_NOTICES.md)。

          **SHA-256:** ``$env:RELEASE_SHA256``
          "@

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $notes -Encoding utf8

          gh release view $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME `
              "dist/UsagePeek.exe#UsagePeek.exe" `
              "dist/SHA256SUMS.txt#SHA256SUMS.txt" `
              "dist/update.json#update.json" `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            gh release edit $env:GITHUB_REF_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --title "UsagePeek $env:GITHUB_REF_NAME" `
              --notes-file $notesPath
          }
          else {
            gh release create $env:GITHUB_REF_NAME `
              "dist/UsagePeek.exe#UsagePeek.exe" `
              "dist/SHA256SUMS.txt#SHA256SUMS.txt" `
              "dist/update.json#update.json" `
              --repo $env:GITHUB_REPOSITORY `
              --title "UsagePeek $env:GITHUB_REF_NAME" `
              --notes-file $notesPath `
              --verify-tag
          }
